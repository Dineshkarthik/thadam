[package]
name = "adr012-yaml"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Spike for ADR-0012: YAML crate comparison (serde_norway, serde_yaml_ng, serde-saphyr)"

# Standalone project: the root thadam workspace excludes spikes/, so this
# empty table keeps cargo from searching upward for a parent workspace.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1.20"
humantime = "2"
bytesize = "2"
serde_norway = "=0.9.42"
serde_yaml_ng = "=0.10.0"
serde-saphyr = "=1.3.0"
