[package]
name = "adr018-filter"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Spike for ADR-0018: per-event filter evaluation cost of CEL vs structured predicates vs evalexpr"

# Standalone project: the root thadam workspace excludes spikes/, so this
# empty table keeps cargo from searching upward for a parent workspace.
[workspace]

[features]
default = ["evalexpr"]
# evalexpr is AGPL-3.0-only (crates.io), which the thadam license allow-list rejects.
# It is benchmarked as a data point only; build with --no-default-features to exclude it.
evalexpr = ["dep:evalexpr"]

[dependencies]
cel = "=0.15.0"
evalexpr = { version = "=13.1.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "=1.3.0"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "filters"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
