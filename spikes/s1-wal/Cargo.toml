[package]
name = "s1-wal"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
crc32c = "0.6"
hdrhistogram = { version = "7.5", default-features = false }
libc = "0.2"
redb = "4.3"
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"

[profile.release]
debug = 1
