[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]

[advisories]
yanked = "deny"
# cargo-deny has no "warn" level for unmaintained advisories: they either fail
# or are ignored. Fail only for direct workspace dependencies.
unmaintained = "workspace"
ignore = [
    # RUSTSEC-2023-0071 (`rsa` 0.9: Marvin timing attack), pulled by
    # async-opcua-crypto 0.19, which every secured OPC UA security policy
    # needs. Accepted deliberately (owner decision): RSA is used only in the
    # OPC UA secure-channel handshake, never per message; thadam-opcua
    # rate-limits handshakes (reconnect.max_handshakes_per_minute, default
    # 12/min) which bounds the timing samples an observer can collect; the
    # AES policies (Aes256_Sha256_RsaPss, Aes128_Sha256_RsaOaep) are
    # preferred in the docs; and authentication failures are fatal so a
    # misconfigured secret cannot be retried into a sampling oracle.
    # Revisit: migrate to `rsa` 0.10 when async-opcua adopts it.
    # REVIEW BY 2027-04-01.
    { id = "RUSTSEC-2023-0071", reason = "rsa 0.9 via async-opcua-crypto (OPC UA secure-channel handshake only); handshake rate bounded by thadam-opcua reconnect.max_handshakes_per_minute; AES security policies preferred; migrate to rsa 0.10 when async-opcua adopts it; REVIEW BY 2027-04-01" },
    # RUSTSEC-2026-0041 (`lz4_flex` 0.10.0: LZ4 *block-API* offset
    # validation), pulled by zenoh-transport 1.10.x = the pinned zenoh
    # 1.10.1 of thadam-ros2-live (rmw_zenoh wire lockstep; no fixed 0.10.x
    # exists, and zenoh-transport requires `^0.10`). Accepted with the same
    # scope as the zenoh feature itself: thadam builds zenoh with
    # `transport_tcp` only (no compression features), so no compression is
    # negotiated on the wire and the block API is never exercised at
    # runtime; lz4_flex is additionally resolved with its default
    # `safe-decode` on (only the unsafe-implementation scenario is fully
    # excluded by that); the remaining reused-buffer scenario needs
    # attacker-controlled compressed frames from the router, which is the
    # same LAN trust boundary as the ROS graph itself. Re-pin when a zenoh
    # release accepts lz4_flex >= 0.11.6. REVIEW BY 2027-04-01.
    { id = "RUSTSEC-2026-0041", reason = "lz4_flex 0.10 via zenoh-transport (pinned zenoh 1.10.1, ^0.10 requirement, no fixed 0.10.x); thadam enables no zenoh compression features so the block API is not exercised; safe-decode is on in the resolved graph; exposure is the ROS LAN trust boundary; re-pin when zenoh accepts lz4_flex >= 0.11.6; REVIEW BY 2027-04-01" },
]

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# The allow-list is declared ahead of the dependencies that need it.
unused-allowed-license = "allow"

[[licenses.exceptions]]
crate = "target-lexicon"
allow = ["Apache-2.0 WITH LLVM-exception"]

# MPL-2.0, scoped to the async-opcua crates (owner decision; they are the
# only MPL crates in the tree and stay out unless thadam is built with
# --features opcua). MPL-2.0 is a file-level copyleft: linked as separate
# compilation units in the thadam binary, and any upstream modification
# would have to be published.
[[licenses.exceptions]]
crate = "async-opcua"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "async-opcua-client"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "async-opcua-core"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "async-opcua-crypto"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "async-opcua-types"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "async-opcua-macros"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "async-opcua-nodes"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "async-opcua-server"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "async-opcua-core-namespace"
allow = ["MPL-2.0"]

# MPL-2.0, scoped to option-ext (owner decision 2026-10-12): pulled in only
# when thadam is built with --features ros2-live (zenoh-util 1.10.1 ->
# shellexpand -> dirs -> dirs-sys -> option-ext). File-level copyleft: the
# thadam binary links it as a separate, unmodified compilation unit.
[[licenses.exceptions]]
crate = "option-ext"
allow = ["MPL-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = [
    { crate = "aws-lc-sys", reason = "rustls uses the ring provider; aws-lc needs a cmake/clang cross-compile toolchain" },
    { crate = "openssl-sys", reason = "TLS is rustls only" },
    # serde_yaml is deprecated and unmaintained. It is still banned for
    # workspace code; the accepted wrappers are (1) async-opcua-core 0.19,
    # which uses it only to parse its own YAML client-config files — a code
    # path thadam-opcua never calls (the client is built programmatically) —
    # and (2) zenoh-config 1.10.1, for which serde_yaml is a *mandatory*
    # dependency (owner decision 2026-10-12; dead config-parsing code for
    # us: thadam-ros2-live configures zenoh programmatically via
    # insert_json5, never from YAML). Re-check at each zenoh bump for an
    # upstream release that makes it optional.
    { crate = "serde_yaml", reason = "deprecated and unmaintained", wrappers = ["async-opcua-core", "zenoh-config"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
