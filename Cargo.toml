[workspace]
resolver = "3"
members = [
    "crates/thadam-core",
    "crates/thadam-config",
    "crates/thadam-wal",
    "crates/thadam-transform",
    "crates/thadam-runtime",
    "crates/thadam-arrow",
    "crates/thadam-segments",
    "crates/thadam-object-store",
    "crates/thadam-mqtt",
    "crates/thadam-testkit",
    "apps/thadam-cli",
]
# Spikes are standalone projects with their own [workspace] table.
exclude = ["spikes"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
thadam-core = { path = "crates/thadam-core" }

async-trait = "0.1.92"
bitflags = "2.13"
bytes = "1.12"
serde_json = "1.0.151"
smallvec = "1.15"
thiserror = "2.0.21"
tokio = { version = "1.53", default-features = false }
tokio-util = { version = "0.7.19", default-features = false }

insta = "1.49"
loom = "0.7"
proptest = "1.11"
tempfile = "3.27"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
# Task-boundary panic isolation (a panicking chain task is caught, its frame
# quarantined) only works with unwinding.
panic = "unwind"
