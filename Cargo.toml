[workspace]
resolver = "3"
members = [
    "crates/thadam-core",
    "crates/thadam-config",
    "crates/thadam-wal",
    "crates/thadam-transform",
    "crates/thadam-runtime",
    "crates/thadam-arrow",
    "crates/thadam-segments",
    "crates/thadam-object-store",
    "crates/thadam-mqtt",
    "crates/thadam-ros2-msg",
    "crates/thadam-http",
    "crates/thadam-grpc",
    "crates/thadam-mcap",
    "crates/thadam-modbus",
    "crates/thadam-nats",
    "crates/thadam-kafka",
    "crates/thadam-can",
    "crates/thadam-clickhouse",
    "crates/thadam-opcua",
    "crates/thadam-ros2-live",
    "crates/thadam-testkit",
    "crates/thadam-iceberg",
    "apps/thadam-cli",
    "tools/thadam-simulator",
    "tools/thadam-bench",
    "sdk/python",
]
# Plain `cargo build`/`cargo test` skip sdk/python (it needs a Python toolchain).
default-members = [
    "crates/thadam-core",
    "crates/thadam-config",
    "crates/thadam-wal",
    "crates/thadam-transform",
    "crates/thadam-runtime",
    "crates/thadam-arrow",
    "crates/thadam-segments",
    "crates/thadam-object-store",
    "crates/thadam-mqtt",
    "crates/thadam-ros2-msg",
    "crates/thadam-http",
    "crates/thadam-grpc",
    "crates/thadam-mcap",
    "crates/thadam-modbus",
    "crates/thadam-nats",
    "crates/thadam-kafka",
    "crates/thadam-can",
    "crates/thadam-clickhouse",
    "crates/thadam-opcua",
    "crates/thadam-ros2-live",
    "crates/thadam-testkit",
    "crates/thadam-iceberg",
    "apps/thadam-cli",
    "tools/thadam-simulator",
    "tools/thadam-bench",
]
# Spikes are standalone projects with their own [workspace] table.
exclude = ["spikes"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
thadam-core = { path = "crates/thadam-core" }

axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["http1", "server", "tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rustls-pemfile = { version = "2", default-features = false, features = ["std"] }
url = "2.5"
arrow-array = "60"
prometheus-client = "0.25"
arrow-buffer = "60"
arrow-ipc = "60"
arrow-schema = "60"
async-trait = "0.1.92"
# OPC UA subscription source (thadam-opcua), client only (owner decision). Pure
# Rust (ring + rsa, no OpenSSL/aws-lc); MPL-2.0. Pinned exactly: the RSA key
# exchange pulls rsa 0.9 (RUSTSEC-2023-0071, Marvin; see deny.toml), and 0.19
# is the newest line. The `server` feature is used only by thadam-opcua's
# dev-dependency for the in-process test server.
async-opcua = { version = "=0.19.0", default-features = false }
# ByteString payload encoding in thadam-opcua (OPC UA JSON, Part 6).
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
bitflags = "2.13"
bytes = "1.12"
bytesize = "2.7"
# SocketCAN source (thadam-can), Linux only: `netlink` and `dump` stay off;
# the crate itself adds the `tokio` feature.
socketcan = { version = "4", default-features = false }
# DBC parsing for the CAN source's `emit: decoded` mode. `serde` and
# `encodings` stay off: we parse UTF-8 files and keep encoding_rs out.
can-dbc = { version = "10", default-features = false }
# OPC UA DateTime values (thadam-opcua): UTC conversion and RFC 3339 text.
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
crc32c = "0.6.8"
csv = "1.4"
humantime = "2.4"
lru = "0.18"
# MCAP / rosbag2 file source (thadam-mcap, ADR-0007 stage 2): MIT, Foxglove,
# pure Rust. Default features keep the zstd and lz4 chunk decompressors,
# which rosbag2 recordings need.
mcap = "0.25"
# S3-compatible shipping (thadam-object-store). The `aws` feature is NOT used:
# it requests rustls with the aws-lc provider. `aws-base` compiles the S3
# provider by itself, `reqwest` supplies the transport, and `ring` the crypto
# provider (ADR-0020). reqwest's `rustls-no-provider` with the single
# compiled-in ring provider keeps `aws-lc-sys` and `openssl-sys` out.
object_store = { version = "0.14", default-features = false, features = ["aws-base", "reqwest", "ring"] }
# Iceberg table registration (thadam-iceberg, P2; docs/design/iceberg-append.md).
# Pinned exactly: 0.10.1 (2026-09) is the newest release and the one ADR-0013
# planned `fast_append` against. Apache-2.0, MSRV 1.94, rust-version surfaced
# on thadam-iceberg itself. iceberg builds arrow/parquet 58 (the workspace is
# on 60 — a measured duplicate tree) and reqwest 0.12 with no TLS defaults;
# thadam-iceberg unifies reqwest 0.12's rustls (native roots, no compiled-in
# provider) so the crypto provider stays the workspace's rustls `ring`
# (ADR-0020). `iceberg-storage-opendal` is deliberately not used: it resolves
# reqwest's default rustls stacks through opendal and pulls aws-lc-sys.
iceberg = { version = "=0.10.1" }
iceberg-catalog-rest = { version = "=0.10.1" }
parquet = { version = "60", default-features = false, features = ["arrow", "snap", "zstd", "lz4"] }
reqwest = { version = "0.13", default-features = false, features = ["http2", "rustls-no-provider"] }
prost = { version = "0.14.4", default-features = false, features = ["derive", "std"] }
# Simulator (tools/thadam-simulator): 0.9 pairs with the rand_chacha 0.9 already
# in the lock file (proptest); rand 0.10 is not adopted yet.
rand = "0.9"
rand_chacha = "0.9"
# No TLS feature on purpose: every one of them pulls rustls-webpki ^0.102.8, which
# cannot reach the patched 0.103.x (RUSTSEC-2026-0049/-0098/-0099/-0104). TLS is
# terminated in thadam-mqtt with tokio-rustls + ring (crates/thadam-mqtt/src/tls.rs).
rumqttc = { version = "=0.25.1", default-features = false }
# Kafka batch sink (thadam-kafka, owner decision: pure Rust, no OpenSSL, no
# librdkafka, no aws-lc-sys — ADR-0020; the evaluation lives in the crate
# docs). Pinned exactly: 0.6.0 (2025-03-20) is the newest release. TLS
# via `transport-tls`: rskafka 0.6.0 takes a caller-built
# Arc<rustls::ClientConfig> and enables no crypto provider of its own, so the
# provider is the workspace's rustls+ring (ADR-0020) and aws-lc-sys stays out.
# SASL (PLAIN, SCRAM-SHA-256/512) is built
# in via rsasl over pure-Rust RustCrypto crates. Only the gzip
# (miniz_oxide) and snappy (snap) codecs are enabled: the crate's lz4 and
# zstd codecs are C bindings (`lz4-sys`, `zstd-sys`).
rskafka = { version = "=0.6.0", default-features = false, features = ["transport-tls", "compression-gzip", "compression-snappy"] }
rustix = { version = "1.1.5", default-features = false, features = ["std", "fs"] }
rustls-native-certs = "0.8"
rustls-pki-types = { version = "1.15", features = ["std"] }
schemars = "1.2"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "1.3"
serde_json = "1.0.151"
serde_path_to_error = "0.1.20"
sha2 = "0.11"
smallvec = "1.15"
thiserror = "2.0.21"
tokio = { version = "1.53", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-stream = "0.1.19"
# Modbus TCP polling source (thadam-modbus). Client only: the `tcp-server` feature
# is enabled by thadam-modbus's dev-dependency for the in-process test server.
# Default features (RTU serial) are off: no tokio-serial in the tree.
tokio-modbus = { version = "0.17", default-features = false, features = ["tcp"] }
# gRPC ingest (thadam-grpc). tonic's TLS is the ring provider only (ADR-0020);
# the `tls-aws-lc` feature must stay off. `protox` compiles the .proto in pure
# Rust, so the build needs no `protoc` on PATH.
tonic = { version = "0.14.6", default-features = false, features = ["router", "transport", "codegen", "tls-ring"] }
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
protox = "0.10.0"
tokio-util = { version = "0.7.19", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "env-filter", "ansi", "std"] }
tracing-appender = "0.2"
twox-hash = { version = "2.1", default-features = false, features = ["xxhash3_128"] }
# Live ROS 2 source (thadam-ros2-live, ADR-0007 stage 4, rmw_zenoh transport).
# Exact pin matching the zenoh-c 1.10.x vendored by Jazzy and Lyrical
# rmw_zenoh (spike S3 §12.2: byte-identical wire mapping); re-verify at each
# rmw_zenoh bump. default-features = false + `transport_tcp` only — no TLS,
# QUIC, ws, udp, unixsock — keeps aws-lc-sys/openssl-sys out of the tree.
# Attachments, liveliness and insert_json5 are stable APIs in 1.10.1, so the
# `unstable` feature stays off. License EPL-2.0 OR Apache-2.0; Thadam elects
# Apache-2.0 (ADR-0020). serde_yaml (banned) is a mandatory dependency of
# zenoh-config 1.10.1 and is exceptioned in deny.toml for that crate only.
zenoh = { version = "=1.10.1", default-features = false, features = ["transport_tcp"] }

criterion = { version = "0.8", default-features = false }
insta = "1.49"
loom = "0.7"
proptest = "1.11"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tempfile = "3.27"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
# Task-boundary panic isolation (a panicking chain task is caught, its frame
# quarantined) only works with unwinding.
panic = "unwind"
