[workspace]
resolver = "3"
members = [
    "crates/thadam-core",
    "crates/thadam-config",
    "crates/thadam-wal",
    "crates/thadam-transform",
    "crates/thadam-runtime",
    "crates/thadam-arrow",
    "crates/thadam-segments",
    "crates/thadam-object-store",
    "crates/thadam-mqtt",
    "crates/thadam-testkit",
    "apps/thadam-cli",
]
# Spikes are standalone projects with their own [workspace] table.
exclude = ["spikes"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
thadam-core = { path = "crates/thadam-core" }

axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
arrow-array = "60"
prometheus-client = "0.25"
arrow-buffer = "60"
arrow-ipc = "60"
arrow-schema = "60"
async-trait = "0.1.92"
bitflags = "2.13"
bytes = "1.12"
bytesize = "2.7"
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
crc32c = "0.6.8"
csv = "1.4"
humantime = "2.4"
lru = "0.18"
prost = { version = "0.14.4", default-features = false, features = ["derive", "std"] }
# No TLS feature on purpose: every one of them pulls rustls-webpki ^0.102.8, which
# cannot reach the patched 0.103.x (RUSTSEC-2026-0049/-0098/-0099/-0104). TLS is
# terminated in thadam-mqtt with tokio-rustls + ring (crates/thadam-mqtt/src/tls.rs).
rumqttc = { version = "=0.25.1", default-features = false }
rustix = { version = "1.1.5", default-features = false, features = ["std", "fs"] }
rustls-native-certs = "0.8"
rustls-pki-types = { version = "1.15", features = ["std"] }
schemars = "1.2"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "1.3"
serde_json = "1.0.151"
serde_path_to_error = "0.1.20"
sha2 = "0.11"
smallvec = "1.15"
thiserror = "2.0.21"
tokio = { version = "1.53", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7.19", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "env-filter", "ansi", "std"] }
tracing-appender = "0.2"
twox-hash = { version = "2.1", default-features = false, features = ["xxhash3_128"] }

criterion = { version = "0.8", default-features = false }
insta = "1.49"
loom = "0.7"
proptest = "1.11"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tempfile = "3.27"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
# Task-boundary panic isolation (a panicking chain task is caught, its frame
# quarantined) only works with unwinding.
panic = "unwind"
