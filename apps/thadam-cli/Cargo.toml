[package]
name = "thadam-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "thadam"
path = "src/main.rs"

[features]
default = ["clickhouse"]
# The ClickHouse batch sink (ADR-0008). On by default so `kind: clickhouse`
# works out of the box; `--no-default-features` builds a binary without the
# ClickHouse client and its HTTP stack.
clickhouse = ["dep:thadam-clickhouse"]
# The OPC UA subscription source (`kind: opcua`). Off by default (owner
# decision): `thadam validate`/`thadam run` only accept `kind: opcua` with
# `--features opcua`, which pulls the MPL-2.0 async-opcua client.
opcua = ["dep:thadam-opcua"]
# The live ROS 2 source (`kind: ros2_live`, ADR-0007 stage 4, rmw_zenoh
# transport). Off by default (owner decision): pulls zenoh 1.10.1, whose
# zenoh-config depends on the banned serde_yaml (deny.toml exception).
ros2-live = ["dep:thadam-ros2-live"]

[dependencies]
bytes = { workspace = true }
clap = { workspace = true }
mcap = { workspace = true }
thadam-config = { path = "../../crates/thadam-config" }
thadam-runtime = { path = "../../crates/thadam-runtime" }
thadam-mqtt = { path = "../../crates/thadam-mqtt" }
thadam-http = { path = "../../crates/thadam-http" }
thadam-modbus = { path = "../../crates/thadam-modbus" }
thadam-can = { path = "../../crates/thadam-can" }
thadam-grpc = { path = "../../crates/thadam-grpc" }
thadam-mcap = { path = "../../crates/thadam-mcap" }
thadam-segments = { path = "../../crates/thadam-segments" }
thadam-wal = { path = "../../crates/thadam-wal" }
thadam-object-store = { path = "../../crates/thadam-object-store" }
thadam-nats = { path = "../../crates/thadam-nats" }
thadam-kafka = { path = "../../crates/thadam-kafka" }
thadam-clickhouse = { path = "../../crates/thadam-clickhouse", optional = true }
thadam-opcua = { path = "../../crates/thadam-opcua", optional = true }
thadam-ros2-live = { path = "../../crates/thadam-ros2-live", optional = true }
thadam-core = { workspace = true }
rustls = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "macros", "fs"] }
tracing = { workspace = true }
axum = { workspace = true }
ureq = { version = "3", default-features = false }

[dev-dependencies]
assert_cmd = "2.0"
parquet = { workspace = true }
thadam-testkit = { path = "../../crates/thadam-testkit" }

[lints]
workspace = true
