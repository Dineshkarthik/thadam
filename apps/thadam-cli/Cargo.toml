[package]
name = "thadam-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "thadam"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
thadam-config = { path = "../../crates/thadam-config" }
thadam-runtime = { path = "../../crates/thadam-runtime" }
thadam-mqtt = { path = "../../crates/thadam-mqtt" }
thadam-http = { path = "../../crates/thadam-http" }
thadam-grpc = { path = "../../crates/thadam-grpc" }
thadam-mcap = { path = "../../crates/thadam-mcap" }
thadam-segments = { path = "../../crates/thadam-segments" }
thadam-wal = { path = "../../crates/thadam-wal" }
thadam-object-store = { path = "../../crates/thadam-object-store" }
thadam-core = { workspace = true }
rustls = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "macros", "fs"] }
tracing = { workspace = true }
axum = { workspace = true }
ureq = { version = "3", default-features = false }

[dev-dependencies]
assert_cmd = "2.0"
bytes = { workspace = true }
parquet = { workspace = true }
thadam-testkit = { path = "../../crates/thadam-testkit" }

[lints]
workspace = true
