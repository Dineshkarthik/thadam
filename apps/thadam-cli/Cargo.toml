[package]
name = "thadam"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://thadam.dineshkarthik.me/docs/"
description = "Command-line interface and composition root for the Thadam telemetry data plane"
readme.workspace = true
keywords = ["thadam", "cli", "telemetry", "robotics", "data-plane"]
categories = ["command-line-utilities", "science::robotics"]

[[bin]]
name = "thadam"
path = "src/main.rs"

[features]
default = ["clickhouse"]
# The ClickHouse batch sink (ADR-0008). On by default so `kind: clickhouse`
# works out of the box; `--no-default-features` builds a binary without the
# ClickHouse client and its HTTP stack.
clickhouse = ["dep:thadam-clickhouse"]
# The OPC UA subscription source (`kind: opcua`). Off by default (owner
# decision): `thadam validate`/`thadam run` only accept `kind: opcua` with
# `--features opcua`, which pulls the MPL-2.0 async-opcua client.
opcua = ["dep:thadam-opcua"]
# The live ROS 2 source (`kind: ros2_live`, ADR-0007 stage 4, rmw_zenoh
# transport). Off by default (owner decision): pulls zenoh 1.10.1, whose
# zenoh-config depends on the banned serde_yaml (deny.toml exception).
ros2-live = ["dep:thadam-ros2-live"]
# The Iceberg registrar (`kind: iceberg`, P2 experimental;
# docs/design/iceberg-append.md). Off by default: pulls `iceberg` 0.10.1,
# which builds a second arrow/parquet tree (58 next to the workspace's 60)
# and reqwest 0.12 next to 0.13.
iceberg = ["dep:thadam-iceberg"]

[dependencies]
bytes = { workspace = true }
clap = { workspace = true }
mcap = { workspace = true }
thadam-config = { workspace = true }
thadam-runtime = { workspace = true }
thadam-mqtt = { workspace = true }
thadam-http = { workspace = true }
thadam-modbus = { workspace = true }
thadam-can = { workspace = true }
thadam-grpc = { workspace = true }
thadam-mcap = { workspace = true }
thadam-segments = { workspace = true }
thadam-wal = { workspace = true }
thadam-object-store = { workspace = true }
thadam-nats = { workspace = true }
thadam-kafka = { workspace = true }
thadam-clickhouse = { workspace = true, optional = true }
thadam-opcua = { workspace = true, optional = true }
thadam-ros2-live = { workspace = true, optional = true }
thadam-iceberg = { workspace = true, optional = true }
thadam-core = { workspace = true }
rustls = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "macros", "fs"] }
tracing = { workspace = true }
axum = { workspace = true }
ureq = { version = "3", default-features = false }

[dev-dependencies]
assert_cmd = "2.0"
parquet = { workspace = true }
prost = { workspace = true }
thadam-sparkplug = { path = "../../crates/thadam-sparkplug" }
rumqttc = { workspace = true }
thadam-testkit = { path = "../../crates/thadam-testkit" }

[lints]
workspace = true
