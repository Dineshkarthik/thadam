# Starter pipeline: MQTT telemetry to local Parquet segments.
# Validate before running:
#   thadam validate pipeline.yaml
# Quote identifiers (client_id: "014"). Top-level sizes use MiB/GiB and
# durations use units; connector `config` blocks take integer bytes and seconds.
version: 1

pipeline:
  name: starter
  node_id: node-01
  data_dir: ./thadam-data

sources:
  - id: broker
    kind: mqtt
    config:
      url: mqtt://localhost:1883
      client_id: thadam-node-01          # stable: names the persistent session
      topics: [{ filter: "robots/+/telemetry", qos: 1 }]
      ack_mode: on_commit               # acknowledge after the WAL commit
      max_message_bytes: 1048576        # 1 MiB (connector schema is integer bytes)

wal:
  max_disk: 2GiB                        # WAL disk budget
  segment_bytes: 16MiB
  fsync: { interval: 10ms }             # group-commit interval
  # `on_full` has no default (`thadam validate` fails if it is missing):
  #   - `block` withholds acknowledgements when the WAL budget is full; loss
  #     moves to the broker's bounded session queue, where it can happen
  #     invisibly once queue limits are exceeded.
  #   - `drop_oldest` evicts the oldest WAL segments, surfaces `Gap::Evicted`
  #     records to readers, and increments `thadam_wal_evicted_bytes_total`;
  #     loss is visible in Thadam.
  on_full: block
  retain_for: 1h                        # keep consumed data 1h for replay

datasets:
  - id: telemetry
    match: { source: broker, topic: "robots/+/telemetry" }
    decode: json
    identity: { robot: { id: 100, template: "{topic.1}" } }
    event_id: { key: [robot, seq] }
    dedup: { window: 10m, max_keys: 10k }
    time: { field: /ts_us, unit: us, domain: utc, max_skew: 5s }
    fields:
      - { id: 1000, name: seq,    type: u64, from: /seq, required: true }
      - { id: 1001, name: temp_c, type: f32, from: /temp_c }

sinks:
  - id: local
    kind: parquet
    config:
      datasets: [telemetry]
      row_group_bytes: 8388608          # 8 MiB (connector schema is integer bytes)
      max_disk: 4294967296              # 4 GiB

runtime: { memory_target: 256MiB }

observability:
  logs: { format: pretty, level: info }
  admin: { bind: "127.0.0.1:9464" }
