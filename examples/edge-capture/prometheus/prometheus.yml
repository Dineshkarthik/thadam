# Demo scraping (observe profile). Thadam runs natively; its admin API is
# the host's loopback admin bind from `make run-native` (default 9464).
# Loopback admin has no token in the demo (demo-only posture, see README).
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: thadam
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9464"]
