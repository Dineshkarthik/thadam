# Thadam edge-capture demo broker (plan section 2).
#
# The queue limits are raised so Thadam's persistent session survives demo
# outages without broker-side drops; the defaults (20 in flight, 1000 queued)
# would silently lose data much earlier and are part of scenario F7's story.

listener 1883
allow_anonymous true         # demo only; a TLS/mTLS variant is a documented follow-up

persistence true
persistence_location /mosquitto/data/
autosave_interval 5
persistent_client_expiration 1d

max_inflight_messages 100    # default 20; matches expected_broker_window in the demo configs
max_queued_messages 200000   # default 1000

sys_interval 5
