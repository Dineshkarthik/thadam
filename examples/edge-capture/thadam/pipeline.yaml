# Edge capture demo: MQTT telemetry from a simulated fleet to local Parquet,
# shipped to S3-compatible storage.
#
# Check it without the container secrets:
#   thadam validate --allow-unresolved examples/edge-capture/thadam/pipeline.yaml
# Inside the demo container, /run/secrets is mounted and plain `thadam validate` passes.
#
# Quote identifiers (client_id: "014"). Durations need units, sizes use MiB/GiB.
version: 1

pipeline:
  name: edge-capture
  node_id: edge-01
  data_dir: /var/lib/thadam

sources:
  - id: fleet-mqtt
    kind: mqtt
    config:
      url: mqtt://toxiproxy:21883
      client_id: thadam-edge-01            # stable: persistent session
      clean_start: false                  # persistent session; the v5 session_expiry key is
                                          # omitted (this connection is MQTT 3.1.1)
      keep_alive: 15s
      topics: [{ filter: "thadam-demo/v1/+/+/+", qos: 1 }]
      ack_mode: on_commit
      max_message_bytes: 1048576          # 1 MiB (connector schema is integer bytes)
      expected_broker_window: 20          # Mosquitto's default

wal:
  max_disk: 2GiB
  segment_bytes: 16MiB
  fsync: { interval: 50ms }
  on_full: block                          # explicit; see scenario F7 for drop_oldest
  retain_for: 1h                          # replay window, bounded by max_disk

quarantine: { format: parquet, max_disk: 268435456 }   # 256 MiB (connector schema: integer bytes)

# Dataset schemas (field `id`s, identity level `id`s, `explode`) are declared
# once, here; sinks select datasets by id in their `config.datasets` list.
# `state` and `events` carry a 50k dedup window too — the demo
# simulator's duplicate-publish chaos applies to every stream, and message-level
# dedup must see all six for the oracle's `duplicate_of` expectation to hold.
# Connector config blocks (sources/sinks) take sizes in integer bytes and
# durations in integer seconds; the human forms (1MiB, 60s) validate but the
# connector runtime parse is integer-typed.
datasets:
  - id: telemetry
    match: { source: fleet-mqtt, topic: "thadam-demo/v1/+/+/telemetry" }
    decode: json
    identity: { site: { id: 100, template: "{topic.2}" }, robot: { id: 101, template: "{topic.3}" } }
    event_id: { key: [site, robot, seq] }
    dedup: { window: 10m, max_keys: 500k }          # message level, before explode
    time: { field: /ts_us, unit: us, domain: utc, max_skew: 5s }
    fields:
      - { id: 1000, name: seq,          type: u64,        from: /seq, required: true }
      - { id: 1001, name: soc_pct,      type: f32,        from: /soc_pct }
      - { id: 1002, name: voltage_v,    type: f32,        from: /voltage_mv,   unit: mV,   convert_to: V }
      - { id: 1003, name: current_a,    type: f32,        from: /current_ma,   unit: mA,   convert_to: A }
      - { id: 1004, name: cpu_temp_c,   type: f32,        from: /cpu_temp_dc,  unit: dCel, convert_to: Cel }
      - { id: 1005, name: motor_temp_c, type: "list<f32>", from: /motor_temp_dc, unit: dCel, convert_to: Cel }

  - id: joints
    match: { source: fleet-mqtt, topic: "thadam-demo/v1/+/+/joints" }
    decode: json
    identity: { site: { id: 100, template: "{topic.2}" }, robot: { id: 101, template: "{topic.3}" } }
    event_id: { key: [site, robot, seq] }
    dedup: { window: 10m, max_keys: 500k }
    explode: { path: /samples, index_field: sample_idx }
    time: { field: /ts_us, unit: us, domain: utc, max_skew: 5s }   # relative to each sample
    fields:
      - { id: 1000, name: seq,            type: u64,         from: "^/seq" }   # ^ = parent message
      - { id: 1001, name: position_rad,   type: "list<f64>", from: /pos }
      - { id: 1002, name: velocity_rad_s, type: "list<f64>", from: /vel }
      - { id: 1003, name: effort_nm,      type: "list<f64>", from: /eff }

  - id: imu
    match: { source: fleet-mqtt, topic: "thadam-demo/v1/+/+/imu" }
    decode: json
    identity: { site: { id: 100, template: "{topic.2}" }, robot: { id: 101, template: "{topic.3}" } }
    event_id: { key: [site, robot, seq] }
    dedup: { window: 10m, max_keys: 500k }
    explode: { path: /samples, index_field: sample_idx }
    time: { field: /ts_us, unit: us, domain: utc, max_skew: 5s }
    fields:
      - { id: 1000, name: seq,          type: u64, from: "^/seq" }
      - { id: 1001, name: accel_x_m_s2, type: f32, from: /accel/0, unit: "[g]",   convert_to: "m/s2" }
      - { id: 1002, name: accel_y_m_s2, type: f32, from: /accel/1, unit: "[g]",   convert_to: "m/s2" }
      - { id: 1003, name: accel_z_m_s2, type: f32, from: /accel/2, unit: "[g]",   convert_to: "m/s2" }
      - { id: 1004, name: gyro_x_rad_s, type: f32, from: /gyro/0,  unit: "deg/s", convert_to: "rad/s" }
      - { id: 1005, name: gyro_y_rad_s, type: f32, from: /gyro/1,  unit: "deg/s", convert_to: "rad/s" }
      - { id: 1006, name: gyro_z_rad_s, type: f32, from: /gyro/2,  unit: "deg/s", convert_to: "rad/s" }
      - { id: 1007, name: quat_w,       type: f32, from: /quat/0 }
      - { id: 1008, name: quat_x,       type: f32, from: /quat/1 }
      - { id: 1009, name: quat_y,       type: f32, from: /quat/2 }
      - { id: 1010, name: quat_z,       type: f32, from: /quat/3 }

  - id: pose
    match: { source: fleet-mqtt, topic: "thadam-demo/v1/+/+/pose" }
    decode: json
    identity: { site: { id: 100, template: "{topic.2}" }, robot: { id: 101, template: "{topic.3}" } }
    event_id: { key: [site, robot, seq] }
    dedup: { window: 10m, max_keys: 500k }
    explode: { path: /samples, index_field: sample_idx }
    time: { field: /ts_us, unit: us, domain: utc, max_skew: 5s }
    fields:
      - { id: 1000, name: seq,      type: u64, from: "^/seq" }
      - { id: 1001, name: frame_id, type: str, from: /frame }
      - { id: 1002, name: x_m,      type: f64, from: /pos/0 }
      - { id: 1003, name: y_m,      type: f64, from: /pos/1 }
      - { id: 1004, name: z_m,      type: f64, from: /pos/2 }
      - { id: 1005, name: qw,       type: f64, from: /quat/0 }
      - { id: 1006, name: qx,       type: f64, from: /quat/1 }
      - { id: 1007, name: qy,       type: f64, from: /quat/2 }
      - { id: 1008, name: qz,       type: f64, from: /quat/3 }

  - id: state
    match: { source: fleet-mqtt, topic: "thadam-demo/v1/+/+/state" }
    decode: json
    identity: { site: { id: 100, template: "{topic.2}" }, robot: { id: 101, template: "{topic.3}" } }
    event_id: { key: [site, robot, seq] }
    dedup: { window: 10m, max_keys: 50k }            # low-volume stream; covers chaos duplicates
    time: { field: /ts_us, unit: us, domain: utc, max_skew: 5s }
    fields:
      - { id: 1000, name: seq,      type: u64, from: /seq, required: true }
      - { id: 1001, name: mode,     type: str, from: /mode }
      - { id: 1002, name: cycle_id, type: u64, from: /cycle_id }
      - { id: 1003, name: program,  type: str, from: /program }

  - id: events
    match: { source: fleet-mqtt, topic: "thadam-demo/v1/+/+/events" }
    decode: json
    identity: { site: { id: 100, template: "{topic.2}" }, robot: { id: 101, template: "{topic.3}" } }
    event_id: { key: [site, robot, seq] }
    dedup: { window: 10m, max_keys: 50k }            # low-volume stream; covers chaos duplicates
    time: { field: /ts_us, unit: us, domain: utc, max_skew: 5s }
    fields:
      - { id: 1000, name: seq,        type: u64, from: /seq, required: true }
      - { id: 1001, name: event_type, type: str, from: /type }
      - { id: 1002, name: level,      type: str, from: /level }
      - { id: 1003, name: code,       type: str, from: /code }
      - { id: 1004, name: message,    type: str, from: /message }
      - { id: 1005, name: cycle_id,   type: u64, from: /cycle_id }

transforms:
  - kind: validate
    dataset: telemetry
    rules: [{ field: motor_temp_c, min: -40, max: 150, flag: OUT_OF_RANGE, status: bad }]
  - kind: on_change
    dataset: state
    fields: [mode, cycle_id, program]
    heartbeat: 5m
  - kind: filter
    dataset: events
    where: { field: level, ne: debug }

sinks:
  - id: local
    kind: parquet
    config:
      datasets: [telemetry, joints, imu, pose, state, events]
      compression: auto                     # zstd(1) on x86_64, snappy on aarch64 (pending compression benchmark)
      row_group_bytes: 8388608                # 8 MiB (connector schema: integer bytes)
      rotation: { max_bytes: 67108864, max_age: 60 }   # 64 MiB or 60 s; production default 5m
      max_open_files: 6
      max_disk: 4294967296                    # 4 GiB
      timestamp_unit: micros              # micros default; nanos opt-in
      finalize_on_shutdown: true
  - id: s3
    kind: object_store
    config:
      from: local
      pipeline: edge-capture              # written into object keys: fleet/thadam/v1/edge-capture/...
      url: s3://thadam-demo/fleet
      endpoint: http://toxiproxy:29000
      region: us-east-1
      allow_http: true                      # demo only
      access_key_id: "${file:/run/secrets/minio_uploader_key}"
      secret_access_key: "${file:/run/secrets/minio_uploader_secret}"
      upload_concurrency: 2
      multipart_threshold: 33554432   # 32 MiB
      part_size: 8388608              # 8 MiB
      conditional_put: auto                 # probe at startup; falls back to overwrite (safe: immutable files)
      retry: { initial: 1s, max: 60s, jitter: true }   # infinite, visible via metrics
      local_retention: { mode: delete_after_upload, keep_for: 30m }

runtime: { worker_threads: 2, memory_target: 256MiB }

observability:
  logs: { format: json, level: info }
  admin: { bind: "0.0.0.0:9464", token_file: /run/secrets/admin_token }
