nextest-version = "0.9.85"

[profile.default]
fail-fast = true
status-level = "pass"
final-status-level = "slow"

[profile.ci]
fail-fast = false
status-level = "retry"
final-status-level = "fail"

[profile.ci.junit]
path = "junit.xml"

[test-groups]
wal-crash-loop = { max-threads = 1 }
# Parallel EMQX containers starve each other and flake session-loss tests.
emqx-docker = { max-threads = 1 }

[[profile.default.overrides]]
filter = "package(thadam-mqtt) & test(/^emqx_/)"
test-group = "emqx-docker"

[[profile.default.overrides]]
filter = "package(thadam-wal) & test(kill_dash_nine_crash_loop)"
test-group = "wal-crash-loop"
threads-required = 2
slow-timeout = { period = "60s", terminate-after = 5 }
