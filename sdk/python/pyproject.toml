[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "thadam"
# maturin reads the version from the Cargo workspace, so it is bumped in one place.
dynamic = ["version"]
description = "Python SDK for the Thadam edge capture runtime"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = ["telemetry", "robotics", "industrial", "parquet", "arrow"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    # read_segments imports the Arrow stream with pa.Table.from_batches;
    # 14 is the first pyarrow with full PyCapsule stream import.
    "pyarrow>=14",
]

[project.urls]
Homepage = "https://thadam.dineshkarthik.me"
Repository = "https://github.com/Dineshkarthik/thadam"
Documentation = "https://thadam.dineshkarthik.me/docs/"
Changelog = "https://github.com/Dineshkarthik/thadam/blob/main/CHANGELOG.md"
Issues = "https://github.com/Dineshkarthik/thadam/issues"

[tool.maturin]
# Mixed Rust/Python layout: the extension module lands at thadam._native
# inside the pure-Python package under python/.
python-source = "python"
module-name = "thadam._native"
# maturin links the cdylib without libpython; plain `cargo check/test` builds
# without this feature and links libpython so Rust unit tests can run.
features = ["pyo3/extension-module"]
# abi3: one wheel per platform covers Python 3.9+ (pyo3 abi3-py39). pyo3-arrow
# 0.19 stays on stable/abi3-safe APIs (PyCapsule + buffer protocol), so the
# stable ABI suffices — verified against CPython 3.13 in CI.
