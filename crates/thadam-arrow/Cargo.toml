[package]
name = "thadam-arrow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Encoding of Thadam dataset events into Apache Arrow record batches with stable field IDs"
readme = "README.md"
keywords = ["thadam", "arrow", "parquet", "telemetry", "encoding"]
categories = ["encoding", "database"]

[dependencies]
thadam-core = { workspace = true }
arrow-array = { workspace = true }
arrow-buffer = { workspace = true }
arrow-schema = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
arrow-ipc = { workspace = true }
bytes = { workspace = true }
criterion = { workspace = true, features = ["cargo_bench_support"] }
insta = { workspace = true }
parquet = { workspace = true }
proptest = { workspace = true }

[[bench]]
name = "encode"
harness = false

[lints]
workspace = true
