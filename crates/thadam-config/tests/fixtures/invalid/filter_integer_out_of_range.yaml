# filter compares u8 field `flags8` against 300, which is out of range for u8
version: 1
pipeline: { name: demo, node_id: n1, data_dir: /var/lib/thadam }
sources:
  - id: src
    kind: mqtt
    config: { url: "mqtt://broker:1883", topics: [{ filter: "t/+/data", qos: 1 }] }
wal: { max_disk: 1GiB, on_full: block }
datasets:
  - id: readings
    match: { source: src, topic: "t/+/data" }
    decode: json
    identity: { device: "{topic.1}" }
    time: { field: /ts, unit: ms, domain: utc }
    fields:
      - { name: temp, type: f32, from: /temp }
      - { name: level, type: str, from: /level }
      - { name: flags8, type: u8, from: /flags }
transforms:
  - { kind: filter, dataset: readings, where: { field: flags8, ge: 300 } }
sinks:
  - id: local
    kind: parquet
    config: { datasets: [readings] }
