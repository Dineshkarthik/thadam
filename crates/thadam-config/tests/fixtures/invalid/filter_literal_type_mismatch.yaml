# filter compares f32 field `temp` to a string, and applies ordering `gt` to string field `level`
version: 1
pipeline: { name: demo, node_id: n1, data_dir: /var/lib/thadam }
sources:
  - id: src
    kind: mqtt
    config: { url: "mqtt://broker:1883", topics: [{ filter: "t/+/data", qos: 1 }] }
wal: { max_disk: 1GiB, on_full: block }
datasets:
  - id: readings
    match: { source: src, topic: "t/+/data" }
    decode: json
    identity: { device: { id: 100, template: "{topic.1}" } }
    time: { field: /ts, unit: ms, domain: utc }
    fields:
      - { id: 1000, name: temp, type: f32, from: /temp }
      - { id: 1001, name: level, type: str, from: /level }
transforms:
  - { kind: filter, dataset: readings, where: { field: temp, eq: hot } }
  - { kind: filter, dataset: readings, where: { field: level, gt: 3 } }
sinks:
  - id: local
    kind: parquet
    config: { datasets: [readings] }
