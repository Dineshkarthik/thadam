# a field id written as a quoted string instead of an integer
version: 1
pipeline: { name: demo, node_id: n1, data_dir: /var/lib/thadam }
sources:
  - id: src
    kind: mqtt
    config: { url: "mqtt://broker:1883", topics: [{ filter: "t/+/data", qos: 1 }] }
wal: { max_disk: 1GiB, on_full: block }
datasets:
  - id: readings
    match: { source: src, topic: "t/+/data" }
    decode: json
    identity: { site: { id: 100, template: "{topic.0}" } }
    time: { field: /ts, unit: ms, domain: utc }
    fields:
      - { id: "1000", name: a, type: f32, from: /a }
      - { id: 1001, name: b, type: f32, from: /b }
sinks:
  - id: local
    kind: parquet
    config: { datasets: [readings] }
