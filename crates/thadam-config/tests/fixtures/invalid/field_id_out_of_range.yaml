# field ids outside 1000..=4194303 and level ids outside 100..=199
version: 1
pipeline: { name: demo, node_id: n1, data_dir: /var/lib/thadam }
sources:
  - id: src
    kind: mqtt
    config: { url: "mqtt://broker:1883", topics: [{ filter: "t/+/data", qos: 1 }] }
wal: { max_disk: 1GiB, on_full: block }
datasets:
  - id: readings
    match: { source: src, topic: "t/+/data" }
    decode: json
    identity: { site: { id: 99, template: "{topic.0}" }, device: { id: 1000, template: "{topic.1}" } }
    time: { field: /ts, unit: ms, domain: utc }
    fields:
      - { id: 999, name: a, type: f32, from: /a }
      - { id: 100, name: b, type: f32, from: /b }
      - { id: 4194303, name: c, type: f32, from: /c }
      - { id: 4194304, name: d, type: f32, from: /d }
      - { id: 0, name: e, type: f32, from: /e }
sinks:
  - id: local
    kind: parquet
    config: { datasets: [readings] }
