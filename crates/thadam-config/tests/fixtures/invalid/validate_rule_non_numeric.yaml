# validate rule on string field `level`, and a rule on `temp` with min 5 greater than max 1
version: 1
pipeline: { name: demo, node_id: n1, data_dir: /var/lib/thadam }
sources:
  - id: src
    kind: mqtt
    config: { url: "mqtt://broker:1883", topics: [{ filter: "t/+/data", qos: 1 }] }
wal: { max_disk: 1GiB, on_full: block }
datasets:
  - id: readings
    match: { source: src, topic: "t/+/data" }
    decode: json
    identity: { device: "{topic.1}" }
    time: { field: /ts, unit: ms, domain: utc }
    fields:
      - { name: temp, type: f32, from: /temp }
      - { name: level, type: str, from: /level }
transforms:
  - kind: validate
    dataset: readings
    rules:
      - { field: level, min: 0, max: 10, flag: OUT_OF_RANGE, status: bad }
      - { field: temp, min: 5, max: 1, flag: OUT_OF_RANGE, status: bad }
sinks:
  - id: local
    kind: parquet
    config: { datasets: [readings] }
