[package]
name = "thadam-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Pipeline assembly, driver tasks, supervision, recovery, and replay runtime for Thadam"
readme = "README.md"
keywords = ["thadam", "runtime", "telemetry", "robotics", "pipeline"]
categories = ["asynchronous", "concurrency", "science::robotics"]

[dependencies]
axum = { workspace = true }
bytes = { workspace = true }
crc32c = { workspace = true }
prometheus-client = { workspace = true }
thadam-config = { workspace = true }
thadam-core = { workspace = true }
thadam-transform = { workspace = true }
thadam-wal = { workspace = true }
rustix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time", "net"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
futures-util = "0.3"
http-body-util = "0.1"
object_store = { workspace = true }
parquet = { workspace = true }
thadam-object-store = { path = "../thadam-object-store" }
thadam-segments = { path = "../thadam-segments" }
thadam-testkit = { path = "../thadam-testkit" }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time", "test-util"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
