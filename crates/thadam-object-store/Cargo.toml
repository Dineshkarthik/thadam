[package]
name = "thadam-object-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Shipper of finalized Parquet segments to S3-compatible object storage for Thadam"
readme = "README.md"
keywords = ["thadam", "s3", "object-storage", "parquet", "telemetry"]
categories = ["network-programming", "database", "asynchronous"]

[features]
# Exposes `thadam_object_store::failpoints` for fault injection in crash tests
# (`ship::after_put_before_mark`, `ship::mid_multipart`). The crate's own unit
# tests always have them.
failpoints = []

[dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
bytesize = { workspace = true }
object_store = { workspace = true }
reqwest = { workspace = true }
# Not used directly: its `ring` feature turns the shared rustls build on to the
# ring crypto provider, which is what reqwest/rustls-no-provider picks up.
tokio-rustls = { workspace = true }
thadam-core = { workspace = true }
thadam-segments = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "rt", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
futures-util = "0.3"
# ring provider, mirroring workspace tokio-rustls (ADR-0020): the Docker tests
# install it explicitly so reqwest/rustls-no-provider never sees aws-lc.
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
