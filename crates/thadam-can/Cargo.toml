[package]
name = "thadam-can"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
# DBC parsing: default features (serde, encodings) are off; we parse UTF-8
# files only and keep encoding_rs out of the tree.
can-dbc = { workspace = true }
thadam-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing = { workspace = true }

# SocketCAN is Linux-only. `netlink`/`dump` stay off; the `tokio` feature
# brings the AsyncFd-wrapped sockets. Frame decoding has no socketcan
# dependency, so the crate still compiles and unit-tests on macOS.
[target.'cfg(target_os = "linux")'.dependencies]
socketcan = { workspace = true, features = ["tokio"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }

[lints]
workspace = true
