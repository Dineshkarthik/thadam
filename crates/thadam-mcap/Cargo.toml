[package]
name = "thadam-mcap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Resumable MCAP and rosbag2 file replay source connector for Thadam"
readme = "README.md"
keywords = ["thadam", "mcap", "ros2", "rosbag2", "robotics"]
categories = ["science::robotics", "parser-implementations", "filesystem"]

[dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
humantime = { workspace = true }
mcap = { workspace = true }
thadam-core = { workspace = true }
thadam-ros2-msg = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time"] }
tracing = { workspace = true }

[dev-dependencies]
thadam-testkit = { path = "../thadam-testkit" }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }

[lints]
workspace = true
