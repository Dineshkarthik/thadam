[package]
name = "thadam-clickhouse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "ClickHouse native-block batch sink connector with schema validation for Thadam"
readme = "README.md"
keywords = ["thadam", "clickhouse", "telemetry", "arrow", "database"]
categories = ["database", "network-programming", "asynchronous"]

[dependencies]
thadam-core = { workspace = true }
thadam-arrow = { workspace = true }
# The official client (ClickHouse Inc.), vendor-maintained (ADR-0008). TLS is
# rustls with the ring provider only: `rustls-tls-ring`, never `rustls-tls-aws-lc`
# (ADR-0020; `cargo tree -i aws-lc-sys` must stay empty). Roots come from the OS
# trust store (`rustls-tls-native-roots`): it also serves private CAs, and it
# avoids `webpki-roots`, whose CDLA-Permissive-2.0 license `cargo deny` does not allow.
clickhouse = { version = "0.15.2", default-features = false, features = ["lz4", "rustls-tls-ring", "rustls-tls-native-roots"] }
# The type AST (`DateTimePrecision`) the client's `native` module builds on;
# same 0.1 line the client pins, so the types unify.
clickhouse-types = "0.1.3"
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }

[dev-dependencies]
thadam-testkit = { path = "../thadam-testkit" }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
