// Frame payload schema for the Thadam capture WAL (frame version 1).
//
// This file documents the wire schema. The Rust types are hand-written prost
// derives in `src/proto.rs` (no protoc build dependency); a unit test pins the
// encoding of a fixed message so the two cannot drift silently.
//
// The field numbers become permanent when ADR-0004 is accepted and the format
// is frozen. Until then the format is versioned but not frozen.

syntax = "proto3";

package thadam.wal.v1;

// One source batch.
message RawFrame {
  // Index into `dict` of the source identifier, so a frame is self-describing
  // even after the source configuration changes.
  uint32 source_idx = 1;
  // Whether the kernel reported the clock as synchronized at receive time.
  bool clock_synced = 2;
  // Interned strings: the source id and attribute keys and values.
  repeated string dict = 3;
  // Messages in receive order.
  repeated RawRecord records = 4;
}

message RawRecord {
  // Edge receive time, nanoseconds since the Unix epoch, UTC.
  sfixed64 ingest_time_ns = 1;
  // Attribute pairs as (key index, value index) into `RawFrame.dict`, flattened.
  repeated uint32 attr_refs = 2;
  // The message payload exactly as received.
  bytes payload = 3;
}
