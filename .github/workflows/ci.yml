name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"

# The toolchain is installed by rustup from rust-toolchain.toml on first use,
# so the pin lives in one place.
jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: cargo fmt --all --check

  clippy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: cargo clippy --workspace --exclude thadam-python --all-targets --locked -- -D warnings
      - run: cargo clippy -p thadam --all-features --all-targets --locked -- -D warnings
      - run: cargo clippy -p thadam-mqtt --features v5 --all-targets --locked -- -D warnings

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: cargo build --workspace --exclude thadam-python --locked
      - run: cargo run --locked -p thadam -- --version

  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.89 --profile minimal
      - run: cargo +1.89 check --workspace --exclude thadam-python --exclude thadam-iceberg --locked

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest@0.9.146
      - run: cargo nextest run --workspace --exclude thadam-python --locked --profile ci
      - run: cargo nextest run -p thadam --all-features --locked

  python-sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: |
            3.9
            3.12
            3.13
      - run: pip install maturin pytest pyarrow
      - run: maturin build -m sdk/python/Cargo.toml --out dist
      - name: Test the abi3 wheel across Python 3.9, 3.12, and 3.13
        run: |
          for py in python3.9 python3.12 python3.13; do
            "$py" -m venv "$RUNNER_TEMP/venv-$py"
            "$RUNNER_TEMP/venv-$py/bin/pip" install pytest pyarrow dist/*.whl
            "$RUNNER_TEMP/venv-$py/bin/pytest" sdk/python/tests
          done
      - run: cargo clippy -p thadam-python --all-targets --locked -- -D warnings

  # Docker Desktop kernels lack CAN, so the vcan tests only run here.
  can-vcan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" can-utils iproute2
          sudo modprobe vcan
          sudo ip link add dev vcan0 type vcan
          sudo ip link set up vcan0
      - run: cargo test --locked -p thadam-can --test vcan --no-run
      # The FD test changes the interface MTU, which needs CAP_NET_ADMIN.
      # Serial: every test shares vcan0 and would see the others' frames.
      - run: sudo -E env "PATH=$PATH" cargo test --locked -p thadam-can --test vcan -- --include-ignored --test-threads=1

  loom:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTFLAGS: --cfg loom
      CARGO_TARGET_DIR: target/loom
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: cargo test --locked -p thadam-core --release --test loom_disk_budget

  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check

  # Builds every publishable crate from its packaged .crate file; uploads nothing.
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: cargo publish --workspace --dry-run --locked

  python-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install maturin==1.15.0 twine
      - run: maturin sdist -m sdk/python/Cargo.toml --out dist
      - run: twine check --strict dist/*

  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: mdbook@0.5.4
      - run: website/scripts/build.sh
      - run: python3 website/scripts/check.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-dist
          path: website/dist
          if-no-files-found: error

  deps-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: scripts/check-deps.sh --self-test
      - run: scripts/check-deps.sh

  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The three info notes in wal-hw-bench.sh (SC1091, SC2016) are intentional.
      - run: shellcheck --severity=warning scripts/*.sh deploy/*.sh website/scripts/*.sh

  fuzz-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: thadam-transform
            target: chain_process
          - crate: thadam-transform
            target: spec_compile
          - crate: thadam-transform
            target: text_parsers
          - crate: thadam-ros2-msg
            target: msg_parse
          - crate: thadam-ros2-msg
            target: cdr_decode
          - crate: thadam-sparkplug
            target: decoder_handle
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@f0d5300ba8908d942c808f4d31c08471d7798ba3 # nightly
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-fuzz
      - name: Run fuzz smoke (${{ matrix.crate }}/${{ matrix.target }})
        working-directory: crates/${{ matrix.crate }}
        # The prebuilt cargo-fuzz is a musl binary and defaults to a musl target,
        # which sanitizers reject.
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- -max_total_time=60
      - name: Upload fuzz artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.crate }}-${{ matrix.target }}
          path: crates/${{ matrix.crate }}/fuzz/artifacts/
          if-no-files-found: ignore

  docker-suites:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest@0.9.146
      - run: cargo nextest run -p thadam-mqtt --locked --run-ignored only
      - run: cargo nextest run -p thadam-nats --locked --run-ignored only
      - run: cargo nextest run -p thadam-kafka --locked --run-ignored only
      - run: cargo nextest run -p thadam-clickhouse --locked --run-ignored only
      - run: cargo nextest run -p thadam-object-store --locked --run-ignored only
      - run: cargo nextest run -p thadam-iceberg --locked --run-ignored only
      - run: cargo nextest run -p thadam --all-features --locked --run-ignored only
