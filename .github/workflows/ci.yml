name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"

# The toolchain is installed by rustup from rust-toolchain.toml on first use,
# so the pin lives in one place.
jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check

  clippy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo clippy --workspace --exclude thadam-python --all-targets --locked -- -D warnings

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --workspace --exclude thadam-python --locked
      - run: cargo run --locked -p thadam-cli -- --version

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146
      - run: cargo nextest run --workspace --exclude thadam-python --locked --profile ci

  python-sdk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install maturin pytest pyarrow
      - run: maturin build -m sdk/python/Cargo.toml --out dist
      - run: pip install dist/*.whl
      - run: pytest sdk/python/tests
      - run: cargo clippy -p thadam-python --all-targets --locked -- -D warnings

  # Docker Desktop kernels lack CAN, so the vcan tests only run here.
  can-vcan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" can-utils iproute2
          sudo modprobe vcan
          sudo ip link add dev vcan0 type vcan
          sudo ip link set up vcan0
      - run: cargo test --locked -p thadam-can --test vcan --no-run
      # The FD test changes the interface MTU, which needs CAP_NET_ADMIN.
      - run: sudo -E env "PATH=$PATH" cargo test --locked -p thadam-can --test vcan -- --include-ignored

  loom:
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: --cfg loom
      CARGO_TARGET_DIR: target/loom
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked -p thadam-core --release --test loom_disk_budget

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check

  deps-guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-deps.sh --self-test
      - run: scripts/check-deps.sh
