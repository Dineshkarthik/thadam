name: Release

# A `v*` tag builds the `thadam` image and binary on both architectures, the
# Python wheels and sdist, and then:
# - opens a draft GitHub Release, which the maintainer reviews and publishes;
# - publishes the crates to crates.io and the wheels to PyPI through trusted
#   publishing (no stored token). Each publish job waits for approval in its
#   GitHub environment (`crates-io`, `pypi`).
# `workflow_dispatch` runs the builds and smoke tests only. No image is pushed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Read the workspace version
        id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $version"
            exit 1
          fi
      # The binary in the tarball is the one in the image: one compile, on the
      # Dockerfile's bookworm builder, so it needs glibc 2.36 or newer.
      - run: docker build -f deploy/docker/Dockerfile -t thadam:release .
      - name: Smoke-test the image
        run: |
          docker run --rm thadam:release --version
          docker run --rm --entrypoint id thadam:release -u | grep -qx 10001
      - name: Package the binary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          name="thadam-${VERSION}-${TARGET}"
          mkdir "$name"
          id=$(docker create thadam:release)
          docker cp "$id:/usr/local/bin/thadam" "$name/thadam"
          docker rm "$id"
          "$name/thadam" --version
          cp LICENSE README.md CHANGELOG.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thadam-${{ matrix.target }}
          path: thadam-*.tar.gz*
          if-no-files-found: error

  python:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
            smoke: host
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
            smoke: host
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
            smoke: alpine
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2
            smoke: alpine
          - os: macos-15
            target: x86_64-apple-darwin
            manylinux: auto
            smoke: none
          - os: macos-15
            target: aarch64-apple-darwin
            manylinux: auto
            smoke: host
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # abi3: one wheel per platform covers CPython 3.9 and newer.
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.15.0
          rust-toolchain: 1.99.0
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist -m sdk/python/Cargo.toml
      - name: Smoke-test the wheel (host)
        if: matrix.smoke == 'host'
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/venv/bin/python" -c "import thadam"
      - name: Smoke-test the wheel (Alpine musl)
        if: matrix.smoke == 'alpine'
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" python:3.12-alpine \
            sh -c 'pip install --no-deps /dist/*.whl && python -c "import thadam"'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  python-sdist:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.15.0
          command: sdist
          args: --out dist -m sdk/python/Cargo.toml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  crates-io:
    if: github.ref_type == 'tag'
    needs: [build, python, python-sdist]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  pypi:
    if: github.ref_type == 'tag'
    needs: [build, python, python-sdist]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: thadam-*
          path: dist
          merge-multiple: true
      - name: Extract the release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! [ -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            "${prerelease[@]}" \
            --title "Thadam $GITHUB_REF_NAME" \
            --notes-file notes.md
